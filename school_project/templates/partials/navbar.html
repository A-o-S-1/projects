{% load static %}
<header class="site-header">
    <div class="container site-header__inner">
        <a href="{% url 'pages:home' %}" class="brand">
            <span class="brand__mark" aria-hidden="true">
                <!-- Signature arch motif — echoes the school's chapel/classroom
                     architecture, reused as a section divider elsewhere -->
                <svg viewBox="0 0 40 40" width="36" height="36">
                    <path d="M4 34 V18 A16 16 0 0 1 36 18 V34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="brand__text">{{ school_info.school_name }}</span>
        </a>

        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
            <span></span><span></span><span></span>
        </button>

        <nav id="primary-nav" class="primary-nav">
            <ul>
                <li><a href="{% url 'pages:home' %}">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Academics</a></li>
                <li><a href="#">Admissions</a></li>
                <li><a href="#">Staff Directory</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            {% if school_info.result_portal_url %}
            <a href="{{ school_info.result_portal_url }}" class="btn btn--accent nav-cta">Check Result</a>
            {% endif %}
        </nav>
    </div>
</header>
