{% load static %}
<header class="site-header">
    <div class="container site-header__inner">
        <a href="{% url 'pages:home' %}" class="brand">
            <span class="brand__mark" aria-hidden="true">
                <img src="{% static 'img/logo-on-dark.svg' %}" alt="" width="48" height="48">
            </span>
            <span class="brand__text">{{ school_info.school_name }}</span>
        </a>

        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
            <span></span><span></span><span></span>
        </button>

        <nav id="primary-nav" class="primary-nav">
            <ul>
                <li><a href="{% url 'pages:home' %}">Home</a></li>
                <li><a href="{% url 'pages:about' %}">About</a></li>
                <li><a href="#">Academics</a></li>
                <li><a href="{% url 'pages:admissions' %}">Admissions</a></li>
                <li><a href="#">Staff Directory</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="{% url 'contact:contact' %}">Contact</a></li>
            </ul>
            {% if school_info.result_portal_url %}
            <a href="{{ school_info.result_portal_url }}" class="btn btn--accent nav-cta">Check Result</a>
            {% endif %}
        </nav>
    </div>
</header>
