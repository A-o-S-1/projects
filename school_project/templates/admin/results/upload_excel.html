{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width: 500px; margin: 20px 0;">
  <h2>Upload Class Excel Scoresheet (.xlsx)</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top: 15px;">
      <input type="submit" value="Import & Recalculate Ranks" class="default" style="background:#417690; color:#fff; padding:10px 15px; border:none; border-radius:4px; cursor:pointer;">
      <a href="../" style="margin-left: 10px;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
